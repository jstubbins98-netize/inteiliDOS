# inteiliDOS -- universal BIOS configuration
#
# Differences from grub.cfg (modern):
#   • 10-second timeout — gives slow BIOSes and CD drives time to settle
#   • No 'insmod all_video' — avoids VESA/VBE calls that crash some old adapters
#   • Explicit 'insmod biosdisk' — ensures BIOS disk I/O is loaded before boot
#   • Force text terminal — no framebuffer; works on CGA, EGA, and plain VGA
#   • 'set gfxmode=text' + 'insmod vbe' deliberately absent
#   • Serial console enabled — useful for computers with serial output

set timeout=10
set default=0

# Force pure text terminal — compatible with any VGA text-mode card
terminal_input  console
terminal_output console

# Load required modules explicitly (some old BIOSes need them pre-loaded)
insmod biosdisk
insmod part_msdos
insmod multiboot

menuentry "boot inteiliDOS normally" {
    multiboot /boot/inteilidOS.elf
    boot
}

menuentry "boot inteiliDOS in recovery mode" {
    multiboot /boot/inteilidOS.elf recovery
    boot
}

menuentry "install inteiliDOS to your HDD" {
    multiboot /boot/inteilidOS.elf setup
    boot
}

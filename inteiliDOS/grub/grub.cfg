# inteilidOS -- grub/grub.cfg
# GRUB2 bootloader configuration (Multiboot1)
# Boot this ISO from CD-ROM on a supported BIOS computer:
#   1. Burn the inteilidOS.iso to a CD-R using:
#        wodim -v dev=/dev/sr0 speed=1 -data inteilidOS.iso
#   2. Open the computer's BIOS setup using its manufacturer's setup key.
#   3. In the Boot menu, set the CD-ROM drive as Boot Device 1.
#   4. Save with F10 and reboot — GRUB will appear and load the kernel.
#   5. Run SETUP at the inteilidOS shell to install to the IDE hard drive.
#      After installation, set the HDD as Boot Device 1 and remove the CD.

set timeout=5
set default=0

menuentry "boot inteiliDOS normally" {
    insmod all_video
    terminal_output console
    multiboot /boot/inteilidOS.elf
    boot
}

menuentry "boot inteiliDOS in recovery mode" {
    insmod all_video
    terminal_output console
    multiboot /boot/inteilidOS.elf recovery
    boot
}

menuentry "install inteiliDOS to your HDD" {
    insmod all_video
    terminal_output console
    multiboot /boot/inteilidOS.elf setup
    boot
}
